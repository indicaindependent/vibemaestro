name = "vibemaestro-gate"
main = "gate-worker.js"
compatibility_date = "2024-11-01"

[vars]
APP_URL = "https://app.example.com"
REDIRECT_URI = "https://gate.example.com/callback"

[[d1_databases]]
binding = "DB"
database_name = "vibemaestro"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_YOUR_KV_ID"

# secrets: DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN
#          SESSION_SIGNING_KEY BOT_SERVICE_KEY OWNER_DISCORD_ID
