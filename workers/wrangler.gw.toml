name = "vibemaestro-gw"
main = "gw-worker.js"
compatibility_date = "2024-11-01"

[vars]
GATE_URL = "https://gate.example.com"
AIG_SLUG = "your-gateway-slug"
PAID_DAILY_CAP_USD = "3.0"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "vibemaestro"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# secrets: CF_ACCOUNT_ID DEEPSEEK_API_KEY VM_ANTHROPIC_KEY
